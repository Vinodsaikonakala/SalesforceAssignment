<template>
    <lightning-card title="Imperative Account Search" icon-name="standard:account">
        <div class="slds-m-around_medium">

            <lightning-input
                type="text"
                label="Search Keyword"
                value={keywordSearch}
                onchange={handleKeywordSearch}>
            </lightning-input>

            <lightning-button
                class="slds-m-top_medium"
                label="Search"
                variant="brand"
                onclick={handleKeywordSearchClick}>
            </lightning-button>

            <template if:true={accounts.length}>
                <lightning-datatable
                    key-field="Id"
                    data={accounts}
                    columns={columns}>
                </lightning-datatable>
            </template>

            <template if:false={accounts.length}>
                <p class="slds-m-top_medium">
                    <strong>No Accounts Found</strong>
                </p>
            </template>

        </div>
    </lightning-card>
</template>
