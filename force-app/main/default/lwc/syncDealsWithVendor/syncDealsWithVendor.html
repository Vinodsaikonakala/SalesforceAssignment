<template>
    <lightning-card title="Sync Deals with Vendor">

        <div class="slds-m-around_medium">

            <lightning-button
                label="Sync Approved Deals"
                variant="brand"
                onclick={handleSync}
                disabled={isLoading}>
            </lightning-button>

            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Syncing..."
                    size="medium">
                </lightning-spinner>
            </template>

        </div>

        <template if:true={logs}>
            <div class="slds-m-around_medium">
                <h3 class="slds-text-heading_small">Recent Sync Logs</h3>

                <template for:each={logs} for:item="log">
                    <div key={log.Id} class="slds-box slds-m-top_small">
                        <p><b>Status:</b> {log.Status__c}</p>
                        <p><b>Message:</b> {log.Message__c}</p>
                        <p><b>Date:</b> {log.Run_Date__c}</p>
                    </div>
                </template>
            </div>
        </template>

    </lightning-card>
</template>
